name: Rispecchia e pubblica

# Questo sito non ha un motore suo: prende l'edizione gia' costruita dal
# progetto che tiene i dati, cosi' i due non possono mai divergere e le fonti
# vengono interrogate una volta sola per tutti.
#
# GitHub fa partire i lavori pianificati in ritardo, o non li fa partire, e
# l'ora tonda e' il momento peggiore: con il cron alle 6:00 non e' mai partito
# nemmeno un giro. Quindi minuti dispari, e due tentativi al giorno perche' la
# sorgente stessa puo' arrivare tardi. Ogni giro ripubblica comunque, anche se
# la versione e' la stessa di prima.
on:
  schedule:
    - cron: '47 5 * * *'
    - cron: '47 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pagine
  cancel-in-progress: false

env:
  SORGENTE: https://andreottiviii.github.io/duri-a-morire/tracker.html

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prendi l'edizione dalla sorgente
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 15 "$SORGENTE" -o nuovo.html

          # Una pagina buona pesa oltre un mega perche' si porta dentro i dati.
          # Se ne arriva una piccola e' un errore travestito da pagina, e si
          # preferisce ripubblicare quella di ieri piuttosto che il vuoto.
          PESO=$(wc -c < nuovo.html)
          if [ "$PESO" -lt 500000 ]; then
            echo "Scaricati solo $PESO byte: la sorgente non sta bene, mi fermo."
            exit 1
          fi
          if ! grep -q "Prima Repubblica Tracker" nuovo.html; then
            echo "Il file scaricato non e' l'edizione giusta, mi fermo."
            exit 1
          fi

          VERSIONE=$(grep -o '"generato":"[0-9-]\{10\}"' nuovo.html | head -1 \
            | grep -o '[0-9-]\{10\}')
          echo "La sorgente porta la data del $VERSIONE, $PESO byte."

          mv nuovo.html sito/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: pubblicazione
        uses: actions/deploy-pages@v4
