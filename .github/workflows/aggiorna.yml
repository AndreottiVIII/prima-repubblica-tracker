name: Rispecchia e pubblica

# Questo sito non ha un motore suo: prende l'edizione gia' costruita dal
# progetto che tiene i dati, cosi' i due non possono mai divergere e le fonti
# vengono interrogate una volta sola per tutti.
#
# GitHub fa partire i lavori pianificati in ritardo, o non li fa partire, e
# l'ora tonda e' il momento peggiore: con il cron alle 6:00 non e' mai partito
# nemmeno un giro. Quindi minuti dispari, e due tentativi al giorno perche' la
# sorgente stessa puo' arrivare tardi. Ogni giro ripubblica comunque, anche se
# la versione e' la stessa di prima.
on:
  schedule:
    - cron: '47 5 * * *'
    - cron: '47 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: pagine
  cancel-in-progress: false

# Dalla sorgente arriva un archivio: una pagina per ogni schermata del
# Televideo (l'indice, i viventi, ogni scheda), piu' il programma comune e la
# mappa del sito. Ogni schermata ha cosi' un indirizzo vero che Google puo'
# trovare, mentre a vista il sito resta identico.
env:
  SORGENTE: https://andreottiviii.github.io/duri-a-morire/primarepubblica.tar.gz

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prendi l'edizione dalla sorgente
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 15 "$SORGENTE" -o edizione.tar.gz

          # Un archivio buono pesa oltre un mega. Se ne arriva uno piccolo e'
          # un errore travestito da archivio, e si preferisce ripubblicare il
          # sito di ieri piuttosto che il vuoto.
          PESO=$(wc -c < edizione.tar.gz)
          if [ "$PESO" -lt 500000 ]; then
            echo "Scaricati solo $PESO byte: la sorgente non sta bene, mi fermo."
            exit 1
          fi
          mkdir nuovo
          tar -xzf edizione.tar.gz -C nuovo

          if [ ! -f nuovo/index.html ] || ! grep -q "Prima Repubblica Tracker" nuovo/index.html; then
            echo "L'archivio scaricato non e' l'edizione giusta, mi fermo."
            exit 1
          fi
          # Il programma si porta dentro i dati: piccolo vuol dire vuoto.
          PROGRAMMA=$(wc -c < nuovo/televideo.js)
          if [ "$PROGRAMMA" -lt 500000 ]; then
            echo "Il programma pesa solo $PROGRAMMA byte, mi fermo."
            exit 1
          fi
          # Una scheda per persona: se ne mancano molte, qualcosa si e' rotto.
          SCHEDE=$(find nuovo/onorevole -name index.html | wc -l)
          if [ "$SCHEDE" -lt 4000 ]; then
            echo "Nell'archivio ci sono solo $SCHEDE schede, mi fermo."
            exit 1
          fi

          VERSIONE=$(grep -o '"generato":"[0-9-]\{10\}"' nuovo/index.html | head -1 \
            | grep -o '[0-9-]\{10\}')
          echo "La sorgente porta la data del $VERSIONE: $SCHEDE schede, archivio di $PESO byte."

          # Sopra quello che c'e' gia': l'immagine per le anteprime, l'icona e
          # robots.txt stanno solo qui e restano. La mappa del sito arriva
          # con l'archivio e prende il posto di quella vecchia.
          cp -R nuovo/. sito/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: pubblicazione
        uses: actions/deploy-pages@v4
